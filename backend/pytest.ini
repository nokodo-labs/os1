[pytest]
testpaths = api/tests nokodo_ai/tests tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts =
    -x
    -n auto
    --maxprocesses=28
    --strict-markers
    --tb=short
markers =
    asyncio: mark test as async
	integration: mark test as requiring external deps
filterwarnings =
    # TODO: remove once the minimum google-genai version fixes googleapis/python-genai#1640 on Python 3.14.
    ignore:^'_UnionGenericAlias' is deprecated and slated for removal in Python 3\.17$:DeprecationWarning:google\.genai\.types:42
    # TODO: remove once TaskIQ supports loop factories for worker children and pytest-asyncio#1501 is fixed in our minimum version.
    ignore:^'asyncio\.WindowsSelectorEventLoopPolicy' is deprecated and slated for removal in Python 3\.16$:DeprecationWarning:nokodo_ai\.utils\.event_loop:23
    # TODO: remove once TaskIQ supports loop factories for worker children and pytest-asyncio#1501 is fixed in our minimum version.
    ignore:^'asyncio\.set_event_loop_policy' is deprecated and slated for removal in Python 3\.16$:DeprecationWarning:nokodo_ai\.utils\.event_loop:27
